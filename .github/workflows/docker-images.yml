name: Docker Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: docker/app.Dockerfile
            description: Auto Bangumi web UI, API server, RSS scheduler, and qBittorrent coordinator.
          - image: agent
            context: agent
            dockerfile: docker/agent.Dockerfile
            description: Auto Bangumi library mover agent for transferring completed downloads into the media library.
          - image: qbittorrent
            context: docker/qbittorrent
            dockerfile: docker/qbittorrent.Dockerfile
            description: Official qBittorrent-nox image preconfigured for Auto Bangumi with an internal download file server.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=${{ matrix.description }}
            manifest:org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
