services:
  qbittorrent:
    build:
      context: .
      dockerfile: docker/qbittorrent.Dockerfile
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      WEBUI_PORT: 8080
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    depends_on:
      - qbittorrent
    environment:
      API_PORT: 3000
      LIBRARY_CONTAINER_ROOT: /library
      HOST_LIBRARY_ROOT: ${HOST_LIBRARY_ROOT:-E:/Bangumi}
    volumes:
      - ./config/config.yaml:/usr/src/app/config/config.yaml
      - ./db:/usr/src/app/db
      - ${HOST_LIBRARY_ROOT:-E:/Bangumi}:/library
    command: ['node', 'dist/server/backend-server.js']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    init: true
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:3000
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

volumes:
  qbittorrent-config:
  qbittorrent-downloads:
