services:
  qbittorrent:
    build:
      context: .
      dockerfile: docker/qbittorrent.Dockerfile
    init: true
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      WEBUI_PORT: 8080
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    depends_on:
      qbittorrent:
        condition: service_healthy
    environment:
      API_PORT: 3000
      LIBRARY_CONTAINER_ROOT: /library
      HOST_LIBRARY_ROOT: ${HOST_LIBRARY_ROOT:-E:/Bangumi}
    volumes:
      - ./config/config.yaml:/usr/src/app/config/config.yaml
      - ./db:/usr/src/app/db
      - ${HOST_LIBRARY_ROOT:-E:/Bangumi}:/library
    command: ['node', 'dist/server/backend-server.js']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/config'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:3000
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qbittorrent-config:
  qbittorrent-downloads:
