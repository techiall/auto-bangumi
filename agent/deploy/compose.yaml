services:
  agent:
    build:
      context: ../..
      dockerfile: docker/agent.Dockerfile
    environment:
      DOWNLOAD_SERVER_URL: ${DOWNLOAD_SERVER_URL}
      LIBRARY_DISPLAY_ROOT: ${HOST_LIBRARY_ROOT}
      LIBRARY_CONTAINER_ROOT: /library
      MOVER_API_TOKEN: ${MOVER_API_TOKEN}
    volumes:
      - ${HOST_LIBRARY_ROOT}:/library
    restart: unless-stopped
