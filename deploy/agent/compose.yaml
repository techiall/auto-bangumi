services:
  agent:
    image: ghcr.io/techiall/auto-bangumi-agent:latest
    environment:
      DOWNLOAD_SERVER_URL: ${DOWNLOAD_SERVER_URL}
      LIBRARY_DISPLAY_ROOT: ${HOST_LIBRARY_ROOT}
      SERVER_USERNAME: ${SERVER_USERNAME}
      SERVER_PASSWORD: ${SERVER_PASSWORD}
    volumes:
      - ${HOST_LIBRARY_ROOT}:/library
    restart: unless-stopped
